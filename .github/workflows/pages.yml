name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-ui/package-lock.json

      - name: Install design library dependencies
        run: npm ci --prefix design-ui --no-audit --no-fund --ignore-scripts

      - name: Build design library
        run: npm run build --prefix design-ui

      - name: Remove design build dependencies
        run: rm -rf design-ui/node_modules design-ui/tsconfig.tsbuildinfo

      - name: Refresh About profile stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate-profile-stats.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
