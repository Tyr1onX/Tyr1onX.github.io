name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DESIGN_BUILD_CACHE_VERSION: v2
  DESIGN_DEPS_CACHE_VERSION: v1

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # assets/design is generated and intentionally not committed. The source hash
      # only includes real Design Library inputs; generated node_modules must never
      # participate in the key or restore/save would calculate different keys.
      - name: Restore built design library
        id: design_build_cache
        uses: actions/cache/restore@v4
        with:
          path: assets/design
          key: design-build-${{ env.DESIGN_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('design-ui/package-lock.json', 'design-ui/package.json', 'design-ui/tsconfig.json', 'design-ui/vite.config.ts', 'design-ui/src/**', 'design-ui/components/**', 'design-ui/public/**') }}

      - name: Setup Node for design rebuild
        if: steps.design_build_cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-ui/package-lock.json

      # npm's download cache alone did not avoid a ~16 minute npm ci on hosted runners.
      # Cache the installed dependency tree as well, keyed strictly to the lockfile.
      - name: Restore design dependencies
        if: steps.design_build_cache.outputs.cache-hit != 'true'
        id: design_deps_cache
        uses: actions/cache/restore@v4
        with:
          path: design-ui/node_modules
          key: design-deps-${{ env.DESIGN_DEPS_CACHE_VERSION }}-${{ runner.os }}-node22-${{ hashFiles('design-ui/package-lock.json') }}

      - name: Install design library dependencies
        if: steps.design_build_cache.outputs.cache-hit != 'true' && steps.design_deps_cache.outputs.cache-hit != 'true'
        run: npm ci --prefix design-ui --no-audit --no-fund --ignore-scripts --prefer-offline

      - name: Save design dependencies
        if: steps.design_build_cache.outputs.cache-hit != 'true' && steps.design_deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: design-ui/node_modules
          key: design-deps-${{ env.DESIGN_DEPS_CACHE_VERSION }}-${{ runner.os }}-node22-${{ hashFiles('design-ui/package-lock.json') }}

      - name: Build design library
        if: steps.design_build_cache.outputs.cache-hit != 'true'
        run: npm run build --prefix design-ui

      - name: Save built design library
        if: steps.design_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/design
          key: design-build-${{ env.DESIGN_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('design-ui/package-lock.json', 'design-ui/package.json', 'design-ui/tsconfig.json', 'design-ui/vite.config.ts', 'design-ui/src/**', 'design-ui/components/**', 'design-ui/public/**') }}

      - name: Remove design build dependencies
        if: steps.design_build_cache.outputs.cache-hit != 'true'
        run: rm -rf design-ui/node_modules design-ui/tsconfig.tsbuildinfo

      - name: Reuse cached design library
        if: steps.design_build_cache.outputs.cache-hit == 'true'
        run: echo "Design Library cache hit; skipped Node setup, npm ci and Vite build."

      - name: Prepare music artwork and previews
        run: python scripts/generate-music-assets.py

      - name: Refresh About profile stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate-profile-stats.py

      - name: Version shared stylesheet
        shell: bash
        run: |
          WIKI_VERSION="$(sha256sum wiki.css | cut -c1-12)"
          for file in ./*.html; do
            sed -i -E "s#\./wiki\.css\?v=[0-9A-Za-z._-]+#./wiki.css?v=${WIKI_VERSION}#g" "$file"
          done
          echo "wiki.css version: ${WIKI_VERSION}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
