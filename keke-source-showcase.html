<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>课刻界面演示</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/fluent-controls.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/time-flow.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/settings.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/timetable-management.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Tyr1onX/desktop-course-widget@55d6947728f0feea1becb8339c83f36e985849c3/src/import-review-v2.css" />
  <style>
    :root { color-scheme: light; }
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f6f8} body{min-width:0!important;font-family:"Segoe UI Variable","Microsoft YaHei UI",sans-serif}.showcase-frame{position:relative;width:100%;height:100%;overflow:hidden;background:#f4f6f8}.showcase-frame:before{position:absolute;inset:0;content:"";background:radial-gradient(circle at 50% 10%,rgba(255,255,255,.95),rgba(246,248,251,.96) 48%,#eef2f6 100%)}.showcase-screen{position:absolute;inset:4.5% 4.2%;overflow:hidden;border:1px solid rgba(31,35,40,.08);border-radius:14px;background:#fbfbfc;box-shadow:0 24px 70px rgba(31,35,40,.12)}.showcase-screen .settings-app{min-width:0}.showcase-widget-wrap{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#dce8f6 0%,#eef3f7 38%,#c7d8ee 100%)}.showcase-widget-wrap:before,.showcase-widget-wrap:after{position:absolute;content:"";border-radius:50%;pointer-events:none}.showcase-widget-wrap:before{width:72%;height:74%;right:-18%;bottom:-34%;border:2px solid rgba(255,255,255,.75);background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(80,132,205,.26));transform:rotate(-24deg)}.showcase-widget-wrap:after{width:78%;height:58%;left:-30%;top:48%;border-top:2px solid rgba(255,255,255,.72);background:linear-gradient(180deg,rgba(90,150,220,.08),rgba(82,116,190,.19));transform:rotate(15deg)}.showcase-widget-wrap .course-widget{position:relative;z-index:2;--widget-width:360px;--widget-scale:1.12;transform:scale(1.12);transform-origin:center}.showcase-widget-wrap .widget-drag-surface{cursor:default}.showcase-widget-wrap .date-nav{display:none}.showcase-settings{width:100%;height:100%;--time-column:64px;--row-height:54px}.showcase-settings .schedule-stage,.showcase-settings .schedule-scroll{overflow:hidden}.showcase-settings .schedule-head,.showcase-settings .schedule-body{min-width:0;grid-template-columns:64px repeat(7,minmax(72px,1fr))}.showcase-settings .lesson-label{height:54px!important}.showcase-settings .day-column{height:540px!important}.showcase-settings .course-card strong{font-size:11px}.showcase-settings .course-card span{font-size:9px}.showcase-settings .side-surface{width:min(410px,44%)}.showcase-settings .side-surface--wide{width:min(470px,50%)}.showcase-settings .surface-scroll{scrollbar-width:none}.showcase-settings .surface-scroll::-webkit-scrollbar{display:none}@media(max-width:760px){.showcase-screen{inset:3%;border-radius:10px}.showcase-widget-wrap .course-widget{transform:scale(.86)}.showcase-settings{transform:scale(.82);transform-origin:top left;width:122%;height:122%}}
  </style>
</head>
<body><div class="showcase-frame" id="root"></div><script>
const q=new URLSearchParams(location.search),view=q.get('view')||'widget',root=document.querySelector('#root');
const lessonTimes=[['08:00','08:45'],['08:55','09:40'],['10:00','10:45'],['10:55','11:40'],['13:30','14:15'],['14:25','15:10'],['15:30','16:15'],['16:25','17:10'],['18:00','18:45'],['18:55','19:40']],days=['一','二','三','四','五','六','日'],dates=[21,22,23,24,25,26,27],courseData=[{name:'高等数学',day:1,start:0,end:1,color:'#CFE1FF',location:'教学楼 A101'},{name:'大学英语',day:2,start:2,end:3,color:'#D8EBCF',location:'教学楼 A101'},{name:'程序设计基础',day:3,start:4,end:5,color:'#F8D8D2',location:'实验楼 B203'},{name:'计算机网络',day:5,start:6,end:7,color:'#E5D9F7',location:'实验楼 B203'}];
function widget(){return `<div class="showcase-widget-wrap"><article class="course-widget theme-light tone-morning"><header class="widget-header"><div class="widget-drag-surface"><div class="widget-heading"><div class="title-row"><p class="widget-title">9月21日课表</p><span class="today-badge">今日</span></div><p class="date-line">星期一 · 第3教学周</p></div><div class="header-right"><div class="header-meta"><time class="now-time">08:48</time></div></div></div></header><div class="widget-body"><section class="focus-course is-current has-time-flow"><p class="focus-kicker">正在上课</p><h2>高等数学</h2><p class="course-time">08:00–09:40</p><p class="course-location">教学楼 A101</p><p class="countdown">还剩 52 分钟</p><div class="course-flow"><div class="course-flow-meta"><span>时间进度</span><span>48%</span></div><div class="course-flow-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="48"><span style="--course-progress:.48"></span></div></div></section><section class="following"><p class="section-label">后续课程</p><ol class="timeline"><li><time>10:00</time><span><strong>概率论</strong><small>教学楼 A101</small></span></li><li><time>13:30</time><span><strong>程序设计基础</strong><small>实验楼 B203</small></span></li></ol></section></div><footer class="widget-week-meta"><span>教学周 3 / 18</span><span>9月21日 – 9月27日</span></footer></article></div>`}
function scheduleGrid(surface=''){const headers=days.map((d,i)=>`<div class="day-heading${i===0?' is-today':''}"><span>${d}</span><strong>${dates[i]}</strong></div>`).join(''),labels=lessonTimes.map((t,i)=>`<div class="lesson-label" style="height:54px"><strong>${i+1}</strong><span>${t[0]}</span></div>`).join(''),cols=days.map((_,i)=>`<div class="day-column" style="height:540px">${courseData.filter(c=>c.day===i+1).map(c=>`<button class="course-card${view==='course'&&c.name==='高等数学'?' is-selected':''}" type="button" style="--course-color:${c.color};top:${c.start*54+3}px;height:${(c.end-c.start+1)*54-6}px;left:3px;width:calc(100% - 6px)"><strong>${c.name}</strong><span>${c.location}</span></button>`).join('')}</div>`).join('');return `<div class="showcase-screen"><main class="settings-app showcase-settings${surface?' has-surface':''}"><header class="schedule-toolbar"><div class="schedule-selector-wrap"><button class="schedule-selector"><span class="schedule-selector-copy"><strong>示例课表</strong></span><span class="schedule-selector-chevron"></span></button></div><div class="week-switcher"><button class="icon-button week-button">‹</button><span class="week-label">第 3 教学周</span><button class="icon-button week-button">›</button></div><div class="toolbar-actions"><button class="icon-button toolbar-button">＋</button><button class="icon-button toolbar-button">⋯</button></div></header><section class="schedule-stage"><div class="schedule-scroll"><div class="schedule-head"><div class="month-heading"><strong>9</strong><span>月</span></div>${headers}</div><div class="schedule-body" style="--lesson-count:10;--row-height:54px"><div class="lesson-column">${labels}</div>${cols}</div></div>${surface?'<div class="schedule-dimmer"></div>'+surface:''}</section></main></div>`}
function field(label,value,type='text'){return `<label class="field"><span>${label}</span><input type="${type}" value="${value}" /></label>`}
function courseSurface(){return `<aside class="side-surface side-surface--wide"><header class="surface-header"><h2>编辑课程</h2><button class="icon-button surface-close">×</button></header><div class="surface-scroll course-form"><label class="field field--full"><span>课程名称</span><input value="高等数学" /></label><fieldset class="color-field"><legend>课程颜色</legend><div class="color-options"><button class="color-swatch is-active" style="--swatch:#CFE1FF"></button><button class="color-swatch" style="--swatch:#D8EBCF"></button><button class="color-swatch" style="--swatch:#F8D8D2"></button><button class="color-swatch" style="--swatch:#E5D9F7"></button><button class="color-swatch" style="--swatch:#F9E3B7"></button></div></fieldset><div class="section-heading"><div><h3>上课时间</h3><p>一门课程可以添加多个时间段。</p></div></div><div class="slot-list"><section class="slot-card"><header><strong>时间段 1</strong></header><div class="form-grid"><label class="field"><span>星期</span><select><option>周一</option></select></label><div class="field section-range"><span>节次</span><div><select><option>1</option></select><span>至</span><select><option>2</option></select></div></div>${field('起始周','1','number')}${field('结束周','18','number')}<label class="field field--full"><span>重复</span><select><option>每周</option></select></label><label class="field field--full"><span>地点</span><input value="教学楼 A101" /></label><label class="field field--full"><span>老师</span><input value="示例教师" /></label></div><button class="custom-weeks-toggle">展开自定义周次</button></section></div><button class="text-button add-slot">＋ 添加时间段</button></div><footer class="surface-actions"><button class="danger-button">删除课程</button><div class="action-group"><button class="secondary-button">取消</button><button class="primary-button">保存修改</button></div></footer></aside>`}
function timesSurface(){const rows=lessonTimes.slice(0,8).map((t,i)=>`<div class="time-row"><strong>${i+1}</strong><label><span>开始</span><input type="time" value="${t[0]}" /></label><label><span>结束</span><input type="time" value="${t[1]}" /></label></div>`).join('');return `<aside class="side-surface"><header class="surface-header"><h2>作息时间</h2><button class="icon-button surface-close">×</button></header><div class="surface-scroll simple-surface"><div class="surface-intro"><h3>逐节设置时间</h3><p>课表显示多少节由这里的节次数量决定。</p></div><label class="switch-row"><span>每节课时长相同</span><input type="checkbox" /></label><div class="time-list">${rows}</div><div class="inline-actions"><button class="secondary-button">＋ 添加节次</button><button class="secondary-button">删除末节</button></div><button class="text-button">恢复默认作息</button></div><footer class="surface-actions surface-actions--end"><button class="primary-button">保存作息时间</button></footer></aside>`}
function importSurface(){const cards=[['高等数学','周一 · 第 1–2 节 · 1-8周'],['大学英语','周二 · 第 3–4 节 · 1,3,5,7,9,11,13,15周'],['程序设计基础','周三 · 第 5–6 节 · 2,4,6,8,10,12,14,16周']].map((c,i)=>`<details class="import-course-review"${i===0?' open':''}><summary><span class="import-course-copy"><strong>${c[0]}</strong><small>${c[1]}</small></span><span class="import-course-state">信息完整</span></summary>${i===0?`<div class="import-course-review-grid"><label class="field field--full"><span>课程名称</span><input value="高等数学" /></label><label class="field"><span>星期</span><select><option>周一</option></select></label><label class="field"><span>重复</span><select><option>每周</option></select></label><label class="field"><span>开始节次</span><select><option>1</option></select></label><label class="field"><span>结束节次</span><select><option>2</option></select></label><label class="field field--full"><span>教学周</span><input value="1-8" /></label><label class="field"><span>地点</span><input value="教学楼 A101" /></label><label class="field"><span>老师</span><input value="示例教师" /></label></div>`:''}</details>`).join('');return `<aside class="side-surface side-surface--wide"><header class="surface-header"><h2>检查并导入课表</h2><button class="icon-button surface-close">×</button></header><div class="surface-scroll simple-surface import-review-surface"><div class="surface-intro"><h3>检查截图识别结果</h3><p>识别结果先逐项复核，再创建新课表。</p></div><div class="import-summary"><div><span>课程安排</span><strong>4 项</strong></div><div><span>最高教学周</span><strong>16 周</strong></div><div><span>待确认</span><strong>0 项</strong></div></div><div class="import-basics"><label class="field field--full"><span>课表名称</span><input value="示例课表" /></label><label class="field field--full"><span>第一周星期一</span><input type="date" value="2026-09-07" /></label></div><div class="import-review-heading"><div><h3>逐项检查</h3></div><span>4 项</span></div><div class="import-review-list">${cards}</div></div><footer class="surface-actions surface-actions--end"><button class="secondary-button">重新选择图片</button><button class="primary-button">确认并创建课表</button></footer></aside>`}
if(view==='widget')root.innerHTML=widget();else if(view==='course')root.innerHTML=scheduleGrid(courseSurface());else if(view==='times')root.innerHTML=scheduleGrid(timesSurface());else if(view==='import')root.innerHTML=scheduleGrid(importSurface());else root.innerHTML=scheduleGrid();
</script></body></html>
