<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tyr1onX 的个人空间。" />
    <meta name="theme-color" content="#f7f7fa" />
    <title>Tyr1onX</title>
    <link rel="icon" href="./avatar.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body[data-page="home"] .hero { min-height: calc(82svh - 66px); padding: 138px 0 54px; }
      body[data-page="home"] .hero-copy { max-width: 620px; }
      body[data-page="home"] .hero h1 { max-width: none; font-size: clamp(3.6rem, 7vw, 5.6rem); font-weight: 690; letter-spacing: -0.07em; line-height: 1; }
      body[data-page="home"] .hero-links { margin-top: 26px; gap: 22px; }
      body[data-page="home"] .day-flow { padding-top: 118px; }
      body[data-page="home"] .section { padding: 108px 0; }
      body[data-page="home"] .keke-entry { min-height: 540px; }
      body[data-page="home"] .keke-entry-copy { padding: 54px 58px 54px 0; }
      body[data-page="home"] .keke-title-row h2 { margin: 4px 0 0; font-size: 2.8rem; letter-spacing: -0.055em; line-height: 1; }
      body[data-page="home"] .keke-thesis { margin-top: 48px; font-size: clamp(1.55rem, 2.7vw, 2.35rem); }
      body[data-page="home"] .keke-motion { min-height: 540px; }
      body[data-page="home"] .writing-section .section-heading { margin-bottom: 34px; }
      body[data-page="home"] .writing-section .section-heading h2 { font-size: clamp(2rem, 4vw, 3.4rem); }
      .footer-links { display: flex; align-items: center; gap: 20px; }
      @media (max-width: 820px) {
        body[data-page="home"] .hero { min-height: 70svh; padding-top: 104px; }
        body[data-page="home"] .hero h1 { font-size: clamp(3.2rem, 13vw, 4.8rem); }
        body[data-page="home"] .day-flow { padding-top: 96px; }
        body[data-page="home"] .keke-entry-copy { min-height: 430px; padding: 42px 0 48px; }
        body[data-page="home"] .keke-motion { min-height: 440px; }
      }
      @media (max-width: 560px) {
        body[data-page="home"] .hero { min-height: 64svh; padding-top: 88px; }
        body[data-page="home"] .hero h1 { font-size: clamp(3rem, 16vw, 4.2rem); }
        body[data-page="home"] .section { padding: 82px 0; }
        body[data-page="home"] .writing-section .section-heading { display: flex; align-items: baseline; justify-content: space-between; }
      }
    </style>
    <script src="./notes-data.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header" data-scrolled="false">
      <div class="nav-shell">
        <a class="brand" href="./" aria-label="返回首页">
          <img class="brand-avatar" src="./avatar.svg" alt="" />
          <span>Tyr1onX</span>
        </a>

        <nav class="nav-links" aria-label="主导航">
          <a href="#work">课刻</a>
          <a href="#writing">文字</a>
        </nav>

        <div class="nav-actions">
          <a
            class="icon-button"
            href="https://github.com/Tyr1onX"
            target="_blank"
            rel="noreferrer"
            aria-label="打开 Tyr1onX 的 GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.7a9.5 9.5 0 0 0-3 18.52c.48.1.65-.2.65-.46v-1.83c-2.65.58-3.2-1.12-3.2-1.12-.43-1.1-1.06-1.4-1.06-1.4-.87-.6.07-.59.07-.59.96.07 1.46.99 1.46.99.85 1.46 2.24 1.04 2.79.8.08-.62.33-1.04.6-1.28-2.12-.24-4.35-1.06-4.35-4.7 0-1.04.37-1.89.98-2.56-.1-.24-.43-1.21.09-2.52 0 0 .8-.26 2.61.98A9.1 9.1 0 0 1 12 7.22a9 9 0 0 1 2.38.32c1.81-1.23 2.61-.98 2.61-.98.52 1.31.19 2.28.09 2.52.61.67.98 1.52.98 2.56 0 3.65-2.24 4.46-4.37 4.7.34.3.65.88.65 1.78v2.64c0 .26.17.57.66.46A9.5 9.5 0 0 0 12 2.7Z" />
            </svg>
          </a>
          <button class="icon-button theme-toggle" type="button" aria-label="切换到深色模式">
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.3 15.5A8 8 0 0 1 8.5 4.7 8.6 8.6 0 1 0 19.3 15.5Z" />
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3 3.9 3.9M20.1 20.1l-1.4-1.4M18.7 5.3l1.4-1.4M3.9 20.1l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="hero page-width">
        <div class="hero-copy reveal">
          <h1>Tyr1onX</h1>
          <div class="hero-links">
            <a href="#work">课刻 <span aria-hidden="true">↓</span></a>
            <a href="./notes.html">文字 <span aria-hidden="true">→</span></a>
          </div>
        </div>

        <div class="day-flow reveal" aria-label="今天的时间进度">
          <div class="day-flow-meta">
            <span>今天</span>
            <time id="current-time">--:--</time>
          </div>
          <div class="day-flow-track">
            <span class="day-flow-fill"></span>
            <span class="day-flow-marker" aria-hidden="true"></span>
          </div>
          <div class="day-flow-scale" aria-hidden="true">
            <span>00:00</span>
            <span>06:00</span>
            <span>12:00</span>
            <span>18:00</span>
            <span>24:00</span>
          </div>
        </div>
      </section>

      <section class="section page-width" id="work">
        <a class="keke-entry reveal" href="./keke.html">
          <div class="keke-entry-copy">
            <div class="keke-title-row">
              <img
                src="https://raw.githubusercontent.com/Tyr1onX/desktop-course-widget/main/src-tauri/icons/icon.png"
                alt="课刻图标"
              />
              <div>
                <span>桌面课表</span>
                <h2>课刻</h2>
              </div>
            </div>
            <p class="keke-thesis">课表不是固定表格，而是一天在桌面上缓慢流动的时间。</p>
            <span class="read-more">项目记录 <b aria-hidden="true">→</b></span>
          </div>

          <div class="keke-motion" aria-hidden="true">
            <div class="keke-motion-date">今天 · 7月27日</div>
            <div class="keke-motion-line">
              <span></span>
              <i></i>
            </div>
            <div class="keke-motion-course current">
              <time>10:00</time>
              <div>
                <strong>通信原理</strong>
                <small>正在发生</small>
              </div>
            </div>
            <div class="keke-motion-course">
              <time>14:00</time>
              <div>
                <strong>数字信号处理</strong>
                <small>稍后</small>
              </div>
            </div>
          </div>
        </a>
      </section>

      <section class="section page-width writing-section" id="writing">
        <div class="section-heading section-heading-split reveal">
          <h2>文字</h2>
          <a class="quiet-link" href="./notes.html">全部 <span aria-hidden="true">→</span></a>
        </div>
        <div class="writing-list" id="home-notes" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer page-width">
      <p>© <span id="current-year">2026</span> Tyr1onX</p>
      <div class="footer-links">
        <a href="mailto:yit38331@gmail.com">邮箱</a>
        <a href="https://github.com/Tyr1onX" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </footer>
  </body>
</html>
